<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="AI2Sec Ops Console multi-agent penetration testing frontend prototype."
    />
    <title>AI2Sec Ops Console</title>
    <script>
      // 防闪烁：在渲染前恢复用户上次选择的主题（默认浅色）
      (function () {
        try {
          if (localStorage.getItem("ai2sec.theme") === "dark") {
            document.documentElement.dataset.theme = "dark";
          }
        } catch (error) {
          /* localStorage 不可用时保持默认浅色 */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
